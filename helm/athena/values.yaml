name: athena
namespace: giantswarm
userID: 1000
groupID: 1000
image:
  name: athena
  repository: giantswarm/athena
  tag: ""

clusterID: ""
baseDomain: ""

ingress:
  # -- Enable the Ingress resource (set to false when using Gateway API)
  enabled: true
  ingressClassName: "nginx"
  externalDNS: false
  tls:
    clusterIssuer: "letsencrypt-giantswarm"
  annotations: {}

# Gateway API HTTPRoute configuration
route:
  # -- Enable the HTTPRoute resource for Gateway API
  enabled: false
  # -- Name of the HTTPRoute resource
  name: athena
  # -- Set the route kind
  # Valid options are GRPCRoute, HTTPRoute, TCPRoute, TLSRoute, UDPRoute
  kind: HTTPRoute

  annotations: {}
  labels: {}

  # -- Hostnames for the HTTPRoute
  hostnames: []

  # -- Parent gateway references
  parentRefs: []
  # - name: giantswarm-default
  #   namespace: envoy-gateway-system
  #   sectionName: https

  # -- Path matching rules
  matches:
    - path:
        type: PathPrefix
        value: /

  # -- Filters to apply to requests that match this rule
  filters: []

  # -- Additional custom rules that can be added to the route
  additionalRules: []

  # -- Security policy configuration for authentication/authorization
  securityPolicy:
    enabled: false
    # basicAuth:
    #   users:
    #     name: <secret_name>

kubernetes:
  caPem: ""
  api:
    address: ""
    port: 443

managementCluster:
  name: ""

oidc:
  issuerAddress: ""

# provider can be a string or an object
provider:
  kind: ""

security:
  subnet:
    vpn: ""
    customer:
      public: ""
      private: ""
    restrictAccess:
      gsAPI: false

services:
  happa:
    address: ""
  athena:
    address: ""
    host: ""

analytics:
  environmentType: ""
  credentialsJSON: ""

# generic configuration
registry:
  domain: gsoci.azurecr.io

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  seccompProfile:
    type: RuntimeDefault

graphql:
  enableIntrospection: false

global:
  podSecurityStandards:
    enforced: true

monitoring:
  podLogs:
    enabled: true
    tenant: giantswarm

# -- Target CPU architecture for this workload. Empty imposes no constraint.
# `arm64` pins the pod to arm64 nodes, adding both the `kubernetes.io/arch`
# node selector and the toleration for the `kubernetes.io/arch=arm64:NoSchedule`
# taint that Giant Swarm arm64 node pools carry. Both are required, so this
# single value sets both. Requires a multi-arch container image; an amd64-only
# image will crash-loop with `exec format error` on an arm64 node. Do not also
# constrain `kubernetes.io/arch` through `affinity`: a `nodeAffinity` is ANDed
# with the node selector and is not visible to this value, so a contradicting
# one leaves the pod Pending.
architecture: ""

# -- Node selector for pod scheduling. Merged with `architecture`. Pinning to
# arm64 here rather than through `architecture` also adds the arm64 taint
# toleration, so either route is safe. A value that contradicts `architecture`
# fails the render.
nodeSelector: {}

# -- Tolerations for pod scheduling
tolerations: []
